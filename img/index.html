<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta de la Tapa Villaverde 2026</title>
<meta name="description" content="Mapa de los 77 bares de la 10ª Ruta de la Tapa en Villaverde: 6, 7, 8 y 9 de noviembre de 2026. Caña + tapa por 3 €.">
<meta property="og:title" content="10ª Ruta de la Tapa en Villaverde 2026">
<meta property="og:description" content="77 bares · 6, 7, 8 y 9 de noviembre · Caña + Tapa: 3,00 €">
<meta property="og:image" content="https://miguelfn.github.io/img/portada.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#faf6f0; --panel:#ffffff; --ink:#2a1f1a; --muted:#7a6a5f; --line:#eadfd2;
    --accent:#b5361c; --accent-ink:#fff; --gold:#d9a227; --chip:#f3ebe1;
    --shadow:0 1px 2px rgba(60,30,10,.08),0 6px 20px rgba(60,30,10,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1512; --panel:#251d19; --ink:#f3e9df; --muted:#b4a396; --line:#3a2e27;
      --accent:#e0603f; --chip:#30261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1512; --panel:#251d19; --ink:#f3e9df; --muted:#b4a396; --line:#3a2e27;
    --accent:#e0603f; --chip:#30261f; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;gap:16px;align-items:center;padding:12px 16px;background:linear-gradient(90deg,#5a1d10,#8f2c14 55%,#b5481c);color:#fff}
  header img{height:64px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:zoom-in}
  header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(19px,3vw,28px);margin:0;line-height:1.1;letter-spacing:.2px}
  header .sub{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:13.5px;opacity:.95}
  header .price{background:var(--gold);color:#3a2300;font-weight:700;padding:1px 9px;border-radius:999px}
  main{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .tools{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px 4px 8px;font:500 13px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip[aria-pressed="false"]{opacity:.45}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:8px}
  .row label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:4px 9px;font:500 13px Inter,sans-serif;cursor:pointer}
  #list{overflow:auto;flex:1;padding:6px 0}
  .grp{position:sticky;top:-6px;background:var(--panel);padding:10px 14px 6px;font:700 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;z-index:1}
  .grp .bar{flex:1;height:2px;border-radius:2px;opacity:.5}
  .item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
  .item:hover,.item.sel{background:var(--chip)}
  .item.sel{border-left-color:var(--accent)}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--chip)}
  .item h3{margin:0;font:600 14.5px Inter,sans-serif}
  .item p{margin:1px 0 0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .num{font:700 12px Inter,sans-serif;color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 6px}
  .item.done h3{text-decoration:line-through;opacity:.6}
  .item.done .num::after{content:" ✓"}
  #map{min-height:0;height:100%}
  .pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .pin span{transform:rotate(45deg);color:#fff;font:700 11.5px Inter,sans-serif}
  .pin.done{filter:grayscale(.7) brightness(.9)}
  .leaflet-popup-content-wrapper{border-radius:14px;background:var(--panel);color:var(--ink)}
  .leaflet-popup-tip{background:var(--panel)}
  .leaflet-popup-content{margin:0;width:300px!important}
  .pop .pics{display:grid;grid-template-columns:1fr 1fr;gap:2px;border-radius:14px 14px 0 0;overflow:hidden}
  .pop .pics.one{grid-template-columns:1fr}
  .pop .pics img{width:100%;height:130px;object-fit:cover;display:block;cursor:zoom-in}
  .pop .sorp{height:130px;display:grid;place-items:center;background:var(--chip);font:700 15px Fraunces,serif;color:var(--muted);text-align:center}
  .pop .body{padding:10px 14px 12px}
  .pop .tag{font:600 11px Inter,sans-serif;text-transform:uppercase;letter-spacing:.07em}
  .pop h2{font:800 19px/1.15 Fraunces,Georgia,serif;margin:2px 0 6px}
  .pop .tapa{font-weight:600;margin:0}
  .pop .desc{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .pop ul{list-style:none;padding:0;margin:8px 0 10px;font-size:13px}
  .pop li{margin:2px 0}
  .pop a{color:var(--accent)}
  .pop .acts{display:flex;gap:6px;flex-wrap:wrap}
  .pop .acts a,.pop .acts button{flex:1;text-align:center;text-decoration:none;border-radius:8px;padding:7px 8px;font:600 12.5px Inter,sans-serif;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;white-space:nowrap}
  .pop .acts a.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:2000;cursor:zoom-out;padding:16px}
  #lb img{max-width:100%;max-height:100%;border-radius:8px}
  footer{font-size:12px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line)}
  footer a{color:inherit}
  .toggle{display:none}
  @media (max-width:820px){
    header{padding:10px 16px}
    header img{height:52px}
    main{grid-template-columns:1fr;grid-template-rows:1fr}
    aside{position:absolute;inset:auto 0 0 0;height:55%;z-index:1000;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);transition:transform .25s}
    aside.min{transform:translateY(calc(100% - 52px))}
    main{position:relative}
    .toggle{display:block;width:100%;border:0;background:none;color:var(--ink);font:600 14px Inter,sans-serif;padding:12px 16px 4px;cursor:pointer;text-align:left}
    .toggle::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
    .leaflet-popup-content{width:260px!important}
    .pop .pics img,.pop .sorp{height:110px}
  }
</style>
</head>
<body>
<header>
  <img src="portada.jpg" alt="Cartel de la 10ª Ruta de la Tapa en Villaverde 2026" id="cover">
  <div>
    <h1>10ª Ruta de la Tapa en Villaverde 2026</h1>
    <div class="sub">
      <span>📅 6, 7, 8 y 9 de noviembre</span>
      <span class="price">Caña + Tapa: 3,00 €</span>
      <span>🍽️ <b id="count">77</b> bares · 5 barrios</span>
    </div>
  </div>
</header>
<main>
  <aside id="panel">
    <button class="toggle" id="toggle">Lista de bares</button>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Buscar bar, tapa o calle…" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="row">
        <label><input type="checkbox" id="hideSorp"> Ocultar tapas sorpresa</label>
        <button class="btn" id="locate">📍 Cerca de mí</button>
      </div>
    </div>
    <div id="list"></div>
    <footer>Datos del folleto oficial · Organiza Asociación de Autónomos de Villaverde · <a href="https://vivirvillaverde.com" target="_blank" rel="noopener">vivirvillaverde.com</a> · Marca ✓ los bares que ya has visitado.</footer>
  </aside>
  <div id="map"></div>
</main>
<div id="lb"><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="bares.js"></script>
<script>
(function(){
  const {barrios, bares} = window.RUTA;
  const color = Object.fromEntries(barrios.map(b=>[b.name,b.color]));
  const store = {
    get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  const done = new Set(store.get("rt2026-done",[]));
  const active = new Set(barrios.map(b=>b.name));
  let userPos = null, selected = null;
  const panel = document.getElementById("panel");

  const map = L.map("map",{zoomControl:true}).setView([40.35,-3.695],14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const icon = b => L.divIcon({className:"",iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28],
    html:`<div class="pin${done.has(b.id)?" done":""}" style="background:${color[b.barrio]}"><span>${b.id}</span></div>`});

  function popup(b){
    const pics = [b.fotoTapa,b.fotoLocal].filter(Boolean);
    const tel = b.telefono ? b.telefono.split(" / ").map(t=>`<a href="tel:+34${t.replace(/\s/g,"")}">${esc(t)}</a>`).join(" · ") : "";
    const dir = `https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}`;
    return `<div class="pop">
      <div class="pics${pics.length>1||!b.fotoTapa?"":" one"}">
        ${b.fotoTapa?"":`<div class="sorp">🎁 Tapa sorpresa</div>`}
        ${pics.map(p=>`<img src="${p}" alt="" loading="lazy" data-zoom>`).join("")}
      </div>
      <div class="body">
        <div class="tag" style="color:${color[b.barrio]}">${b.id} · ${esc(b.barrio)}</div>
        <h2>${esc(b.nombre)}</h2>
        <p class="tapa">${esc(b.tapa)}</p>
        ${b.descripcion?`<p class="desc">${esc(b.descripcion)}</p>`:""}
        <ul>
          <li>📍 ${esc(b.direccion)}</li>
          ${tel?`<li>📞 ${tel}</li>`:""}
          ${b.email?`<li>✉️ <a href="mailto:${esc(b.email)}">${esc(b.email)}</a></li>`:""}
          ${b.web?`<li>🌐 <a href="https://${esc(b.web)}" target="_blank" rel="noopener">${esc(b.web)}</a></li>`:""}
          ${b.instagram?`<li>📷 <a href="https://instagram.com/${esc(b.instagram)}" target="_blank" rel="noopener">@${esc(b.instagram)}</a></li>`:""}
        </ul>
        <div class="acts">
          <a class="main" href="${dir}" target="_blank" rel="noopener">Cómo llegar</a>
          <a href="${b.googleMaps}" target="_blank" rel="noopener">Google Maps</a>
          <button data-done="${b.id}">${done.has(b.id)?"✓ Visitado":"Marcar visitado"}</button>
        </div>
      </div></div>`;
  }

  const markers = {};
  bares.forEach(b=>{
    const m = L.marker([b.lat,b.lng],{icon:icon(b),title:b.nombre,riseOnHover:true}).bindPopup(()=>popup(b),{maxWidth:320,autoPanPadding:[20,20]});
    m.on("click",()=>select(b.id,false));
    markers[b.id] = m;
  });

  const chips = document.getElementById("chips");
  barrios.forEach(b=>{
    const n = bares.filter(x=>x.barrio===b.name).length;
    const el = document.createElement("button");
    el.className="chip"; el.setAttribute("aria-pressed","true");
    el.innerHTML = `<span class="dot" style="background:${b.color}"></span>${esc(b.name)} <small>${n}</small>`;
    el.onclick = ()=>{ active.has(b.name)?active.delete(b.name):active.add(b.name); el.setAttribute("aria-pressed",active.has(b.name)); render(true); };
    chips.appendChild(el);
  });

  const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const q = document.getElementById("q"), hideSorp = document.getElementById("hideSorp");
  q.oninput = ()=>render(false); hideSorp.onchange = ()=>render(true);

  function dist(b){ if(!userPos) return 0; const R=6371e3,toR=Math.PI/180;
    const dLa=(b.lat-userPos[0])*toR,dLo=(b.lng-userPos[1])*toR;
    const a=Math.sin(dLa/2)**2+Math.cos(userPos[0]*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(a)); }

  function visible(){
    const t = norm(q.value.trim());
    return bares.filter(b=>active.has(b.barrio) && !(hideSorp.checked && b.sorpresa) &&
      (!t || norm([b.nombre,b.tapa,b.descripcion,b.direccion,b.barrio].join(" ")).includes(t)));
  }

  function render(fit){
    const vis = visible(), ids = new Set(vis.map(b=>b.id));
    bares.forEach(b=>{ const m=markers[b.id]; ids.has(b.id)?m.addTo(map):m.remove(); });
    document.getElementById("count").textContent = vis.length;
    const list = document.getElementById("list"); list.innerHTML="";
    const groups = userPos ? [{name:"Más cerca de ti",color:"var(--accent)",items:[...vis].sort((a,b)=>dist(a)-dist(b))}]
      : barrios.map(g=>({...g,items:vis.filter(b=>b.barrio===g.name)})).filter(g=>g.items.length);
    groups.forEach(g=>{
      const h=document.createElement("div"); h.className="grp"; h.style.color=g.color;
      h.innerHTML=`${esc(g.name)} <span class="bar" style="background:${g.color}"></span>`; list.appendChild(h);
      g.items.forEach(b=>{
        const it=document.createElement("div");
        it.className="item"+(done.has(b.id)?" done":"")+(selected===b.id?" sel":""); it.dataset.id=b.id;
        const d = userPos ? ` · ${dist(b)<1000?Math.round(dist(b))+" m":(dist(b)/1000).toFixed(1)+" km"}` : "";
        it.innerHTML=`<img class="thumb" src="${b.fotoTapa||b.fotoLocal}" alt="" loading="lazy">
          <div><h3>${esc(b.nombre)}</h3><p>${esc(b.tapa)}${d}</p></div>
          <span class="num" style="background:${color[b.barrio]}">${b.id}</span>`;
        it.onclick=()=>select(b.id,true);
        list.appendChild(it);
      });
    });
    if(!vis.length) list.innerHTML='<p style="padding:16px;color:var(--muted)">No hay bares que coincidan.</p>';
    if(fit && vis.length){
      const mobile = innerWidth<=820 && !panel.classList.contains("min");
      map.fitBounds(L.latLngBounds(vis.map(b=>[b.lat,b.lng])),{paddingTopLeft:[30,30],
        paddingBottomRight:[30, mobile ? panel.offsetHeight+20 : 30],maxZoom:17});
    }
  }

  function select(id, fromList){
    selected=id;
    document.querySelectorAll(".item").forEach(e=>e.classList.toggle("sel",+e.dataset.id===id));
    const m=markers[id];
    if(fromList){
      if(innerWidth<=820) panel.classList.add("min");
      map.setView(m.getLatLng(),Math.max(map.getZoom(),17),{animate:false}); m.openPopup();
    } else {
      const el=document.querySelector(`.item[data-id="${id}"]`); if(el) el.scrollIntoView({block:"nearest",behavior:"smooth"});
    }
  }

  document.addEventListener("click",e=>{
    const d=e.target.closest("[data-done]");
    if(d){ const id=+d.dataset.done; done.has(id)?done.delete(id):done.add(id); store.set("rt2026-done",[...done]);
      markers[id].setIcon(icon(bares.find(b=>b.id===id))); d.textContent=done.has(id)?"✓ Visitado":"Marcar visitado"; render(false); return; }
    const z=e.target.closest("[data-zoom], #cover");
    if(z){ lb.querySelector("img").src=z.src; lb.style.display="grid"; }
  });
  const lb=document.getElementById("lb"); lb.onclick=()=>lb.style.display="none";
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") lb.style.display="none"; });

  document.getElementById("toggle").onclick=()=>panel.classList.toggle("min");

  let me=null;
  document.getElementById("locate").onclick=()=>{
    if(!navigator.geolocation) return alert("Tu navegador no permite geolocalización.");
    navigator.geolocation.getCurrentPosition(p=>{
      userPos=[p.coords.latitude,p.coords.longitude];
      if(me) me.remove();
      me=L.circleMarker(userPos,{radius:8,color:"#fff",weight:3,fillColor:"#1a73e8",fillOpacity:1}).addTo(map).bindTooltip("Estás aquí");
      map.setView(userPos,16); render(false);
    },()=>alert("No se ha podido obtener tu ubicación."),{enableHighAccuracy:true,timeout:10000});
  };

  render(true);
})();
</script>
</body>
</html>
